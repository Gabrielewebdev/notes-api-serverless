name: Notes API CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1

jobs:
  checks:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Build Lambda package
        run: python scripts/build_lambda.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra init -backend=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform -chdir=infra validate

  deploy:
    name: Deploy and verify
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: notes-api-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Lambda package
        run: python scripts/build_lambda.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::726862573245:role/notes-api-github-deploy
          aws-region: us-east-1
          allowed-account-ids: "726862573245"
          role-session-name: GitHub-${{ github.run_id }}

      - name: Initialize Terraform backend
        run: terraform -chdir=infra init -lockfile=readonly

      - name: Plan deployment
        run: terraform -chdir=infra plan -lock-timeout=120s -out=deploy.tfplan

      - name: Apply deployment
        run: terraform -chdir=infra apply -lock-timeout=120s deploy.tfplan

      - name: Verify deployed API
        run: python scripts/smoke_test.py
